[project]
name = "sillysstv"
version = "0.1.0"
description = "SSTV-like converter: turn photos and arbitrary files into sound and back, so that damaged audio yields damaged-but-whole data."
authors = [
    {name = "SillySSTV contributors"},
]
readme = "README.md"
license = {text = "MIT"}
# Floor deliberately kept high: it decides which numpy/scipy the resolver may
# pick, and older floors pin them to releases that predate the newest CPython
# and therefore ship no matching wheels -- which means building them from
# source. See [tool.pdm.resolution] below.
requires-python = ">=3.11"
keywords = ["sstv", "modem", "mfsk", "reed-solomon", "audio", "steganography", "ham radio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "reedsolo>=1.7.0",
    "soundfile>=0.12.1",
]

[project.scripts]
sillysstv = "sillysstv.cli:main"

[project.urls]
Homepage = "https://github.com/SillySSTV/SillySSTV"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pdm]
distribution = true

[tool.pdm.resolution]
# Never silently fall back to an sdist for the compiled dependencies. Building
# numpy or scipy from source needs a C/Fortran toolchain and takes many
# minutes; a hard resolution error naming the package is a far better failure
# than a surprise compile.
only-binary = ["numpy", "scipy", "pillow"]

[tool.pdm.scripts]
test = "pytest -q"
demo = {shell = "python -m sillysstv.cli --help"}

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
